<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>食愈记 - 菜谱详情</title>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:#f6f7f9; color:#222; }
    .wrap { max-width:760px; margin:0 auto; padding:16px; }
    .card { background:#fff; border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
    .title { font-size:24px; font-weight:700; margin:0 0 8px; }
    .brief { color:#666; line-height:1.6; margin:0; }
    .cover { width:100%; border-radius:10px; margin-top:12px; object-fit:cover; }
    .meta { color:#888; font-size:14px; margin-top:8px; }
    .section-title { font-size:18px; font-weight:700; margin:0 0 10px; }
    .ingredients { white-space:pre-wrap; line-height:1.7; color:#333; margin:0; }
    .step { margin:0 0 14px; line-height:1.7; }
    .step img { width:100%; border-radius:8px; margin-top:8px; }
    .state { text-align:center; color:#666; padding:40px 0; }
    .error { color:#d93025; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="state" class="state">加载中...</div>
    <div id="content" style="display:none;">
      <div class="card">
        <h1 id="name" class="title"></h1>
        <p id="brief" class="brief"></p>
        <img id="cover" class="cover" alt="菜品封面" />
        <div id="meta" class="meta"></div>
      </div>
      <div class="card">
        <h2 class="section-title">用料</h2>
        <p id="ingredients" class="ingredients"></p>
      </div>
      <div class="card">
        <h2 class="section-title">步骤</h2>
        <div id="steps"></div>
      </div>
    </div>
  </div>

  <script>
    /** 与当前页同源，配合 Pages Functions 的 /api/recipe/:id */
    const API_BASE = location.origin;
    const qs = new URLSearchParams(location.search);
    const id = qs.get("id");
    const stateEl = document.getElementById("state");
    const contentEl = document.getElementById("content");

    function setError(msg) {
      stateEl.className = "state error";
      stateEl.textContent = msg;
      contentEl.style.display = "none";
    }

    function normalizeImage(url) {
      if (!url) return "";
      if (url.startsWith("http://") || url.startsWith("https://")) return url;
      return `${API_BASE}${url.startsWith("/") ? "" : "/"}${url}`;
    }

    function unwrapRecipePayload(raw) {
      if (!raw || typeof raw !== "object") return null;
      if (raw.data != null && typeof raw.data === "object") return raw.data;
      return raw;
    }

    function render(data) {
      document.title = `${data.name || "菜谱"} - 食愈记`;
      document.getElementById("name").textContent = data.name || "";
      document.getElementById("brief").textContent = data.brief || "暂无简介";
      const cover = document.getElementById("cover");
      const coverUrl = normalizeImage(data.imageSrc);
      if (coverUrl) {
        cover.src = coverUrl;
        cover.style.display = "block";
      } else {
        cover.style.display = "none";
      }
      const meta = [];
      if (data.difficulty) meta.push(`难度：${data.difficulty}`);
      if (data.time) meta.push(`时长：${data.time}`);
      document.getElementById("meta").textContent = meta.join("  ·  ");
      document.getElementById("ingredients").textContent = data.ingredients || "暂无";
      const stepsEl = document.getElementById("steps");
      stepsEl.innerHTML = "";
      const steps = Array.isArray(data.steps) ? data.steps : [];
      steps.forEach((s, idx) => {
        const div = document.createElement("div");
        div.className = "step";
        const text = typeof s === "string" ? s : (s.text || "");
        const line = document.createElement("div");
        line.innerHTML = `<strong>${idx + 1}.</strong> `;
        const span = document.createElement("span");
        span.textContent = text;
        line.appendChild(span);
        div.appendChild(line);
        const imgs = [];
        if (typeof s !== "string") {
          if (Array.isArray(s.imageSrcs)) imgs.push(...s.imageSrcs);
          else if (s.imageSrc) imgs.push(s.imageSrc);
        }
        imgs.filter(Boolean).forEach((img) => {
          const tag = document.createElement("img");
          tag.src = normalizeImage(img);
          tag.alt = `步骤${idx + 1}`;
          div.appendChild(tag);
        });
        stepsEl.appendChild(div);
      });
      stateEl.style.display = "none";
      contentEl.style.display = "block";
    }

    async function main() {
      if (!id) return setError("缺少菜谱 ID");
      try {
        const res = await fetch(`${API_BASE}/api/recipe/${encodeURIComponent(id)}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.json();
        const data = unwrapRecipePayload(raw);
        if (!data || typeof data !== "object") throw new Error("empty payload");
        render(data);
      } catch (e) {
        console.error("recipe load failed", e);
        setError("菜谱加载失败，请稍后重试");
      }
    }
    main();
  </script>
</body>
</html>
