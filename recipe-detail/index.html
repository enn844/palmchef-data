<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>食愈记</title>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:#f6f7f9; color:#222; }
    .wrap { max-width:640px; margin:0 auto; padding:24px 16px 48px; }
    h1 { font-size:26px; margin:0 0 8px; }
    p { color:#555; line-height:1.7; margin:0 0 16px; }
    .card { background:#fff; border-radius:12px; padding:18px; margin-top:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    a.btn { display:inline-block; margin-top:8px; padding:10px 18px; background:#1a73e8; color:#fff; text-decoration:none; border-radius:8px; font-size:15px; }
    a.btn:hover { filter:brightness(1.05); }
    code { font-size:13px; background:#eee; padding:2px 6px; border-radius:4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>食愈记</h1>
    <p>菜谱分享落地页站点。微信卡片打开后，会进入带 <code>?id=</code> 的菜谱详情页。</p>
    <div class="card">
      <p style="margin:0 0 12px;"><strong>示例</strong>：打开一篇菜谱详情（请把示例 ID 换成你库里真实存在的 id）。</p>
      <a class="btn" href="./recipe/?id=cong-shao-nen-dou-fu-001">查看示例菜谱</a>
    </div>
    <div class="card">
      <p style="margin:0 0 8px;"><strong>部署说明（摘要）</strong></p>
      <p style="margin:0; font-size:14px; color:#666;">
        Cloudflare <strong>Pages</strong> 的根目录指向本文件夹 <code>recipe-detail</code>；配置环境变量 <code>RECIPE_API_ORIGIN</code>；
        <code>functions/</code> 将 <code>/api/recipe/:id</code> 代理到上游。
      </p>
    </div>
  </div>
</body>
</html>
